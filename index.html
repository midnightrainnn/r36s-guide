<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive R36S handheld manual: power on, start a game, save, and shut down.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>R36S Quick Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Silkscreen&display=swap">
<style>
/* Layout: single-column phone manual. Mode tabs on top, a tappable console in the middle, a panel below that changes with the mode */
:root{
  --bg:#eceef1; --surface:#ffffff; --ink:#14171c; --muted:#5b636e; --line:#d6dbe1;
  --accent:#1d6bd0; --accent-soft:#e3eefc; --warn:#c2410c; --warn-soft:#fdeee4; --ok:#15803d; --ok-soft:#e3f5e9;
  --stage-glow:#ffffff;
  /* Console colors match the real unit and stay the same in both themes */
  --dev-body:#141518; --dev-edge:#2b2d32; --dev-cap:#1c1d21; --dev-cap-press:#3a3d45;
  --dev-print:#73767e; --dev-glass:#08090a; --dev-hole:#0a0a0b; --sel:#4da3ff;
  --k-x:#3a86ea; --k-y:#35b25a; --k-a:#e5484d; --k-b:#f3c12f; --led:#3b82f6; --led-charge:#ef4444;
  --scr-bg:#0f141a; --scr-panel:#18202a; --scr-ink:#e7edf3; --scr-dim:#8593a3; --scr-hi:#2f6fdc;
  --scr-logo-bg:#f3f4f6; --scr-logo-ink:#2a2d33; --scr-logo-blue:#2b78d6;
  --sky-1:#5b8de0; --sky-2:#a8d0f5; --grass:#4a9a3a; --dirt:#8a5a2b; --hero:#e5484d; --coin:#f3c12f;
  --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#171a1f; --ink:#e8ebef; --muted:#98a1ac; --line:#2a2f37;
    --accent:#5ea4f5; --accent-soft:#16263b; --warn:#fb923c; --warn-soft:#2d1d12; --ok:#4ade80; --ok-soft:#12291b;
    --stage-glow:#1d2229; --dev-edge:#3a3d44;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --ink:#e8ebef; --muted:#98a1ac; --line:#2a2f37;
  --accent:#5ea4f5; --accent-soft:#16263b; --warn:#fb923c; --warn-soft:#2d1d12; --ok:#4ade80; --ok-soft:#12291b;
  --stage-glow:#1d2229; --dev-edge:#3a3d44;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  font-size:15px; line-height:1.55; -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:460px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
  display:flex; flex-direction:column; gap:16px;
}

.head{display:flex; flex-direction:column; gap:6px}
.eyebrow{font:600 11px/1.3 var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{margin:0; font-size:34px; line-height:1.05; font-weight:900; letter-spacing:-.02em; text-wrap:balance}
h1 span{color:var(--accent)}
.lede{margin:0; color:var(--muted); font-size:14.5px}

.tabs{
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:5;
}
.tab{appearance:none; border:0; background:transparent; color:var(--muted); font:600 14px/1 var(--font-ui); padding:12px 4px; border-radius:9px; cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); font-weight:800}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Step panel */
.guide{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.guide[hidden]{display:none}
.guide-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.guide-chapter{font:600 11px/1.3 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.guide-count{font:600 11px/1 var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap}
.guide-text{margin:0; font-size:20px; font-weight:800; line-height:1.3; text-wrap:balance}
.guide-text b{color:var(--accent)}
.guide-hint{margin:0; color:var(--muted); font-size:14px}
.guide-steps{display:flex; gap:4px}
.guide-steps i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.guide-steps i.done{background:var(--accent)}
.hold{height:8px; border-radius:4px; background:var(--accent-soft); overflow:hidden}
.hold > div{height:100%; width:0; background:var(--accent)}
.msg{margin:0; font-size:13.5px; padding:8px 10px; border-radius:8px}
.msg.wrong{color:var(--warn); background:var(--warn-soft)}
.msg.good{color:var(--ok); background:var(--ok-soft)}
.guide.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.guide-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13.5px/1 var(--font-ui); padding:10px 13px; border-radius:8px; cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Console */
.stage{border-radius:18px; padding-block:14px 6px; background:radial-gradient(120% 70% at 50% 35%, var(--stage-glow), var(--bg) 70%); display:flex; justify-content:center}
.device{position:relative; width:min(100%, 320px, calc(60svh * 360 / 610)); aspect-ratio:360/610; max-width:100%}
.guide-mode .device{width:min(100%, 320px, calc(44svh * 360 / 610))}
.device svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.key{cursor:pointer; outline:none; touch-action:none; -webkit-touch-callout:none}
.key .cap{fill:var(--dev-cap); stroke:var(--dev-edge); stroke-width:1.2; transition:fill .08s}
.key.pressing .cap{fill:var(--dev-cap-press)}
.key.is-active .cap, .key.is-held .cap{stroke:var(--sel); stroke-width:2.6}
.key.is-held .cap{fill:var(--dev-cap-press)}
.key:focus-visible .cap{stroke:var(--sel); stroke-width:2.6; stroke-dasharray:4 3}
.key.is-target .cap{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke:var(--sel); stroke-width:1.5}50%{stroke:var(--sel); stroke-width:4.5}}
.print{font:600 7.5px var(--font-mono); fill:var(--dev-print); letter-spacing:.08em}
.outside{font:600 9px var(--font-ui); fill:var(--muted)}
.letter{font:800 15px var(--font-ui); pointer-events:none}
.tablabel{font:700 7px var(--font-mono); fill:var(--dev-print); pointer-events:none}
.arrow{fill:#3c3f46; pointer-events:none}
#ledGlow{opacity:0; transition:opacity .3s, fill .3s}
.led-on #ledGlow{opacity:.55}
.led-on #ledDot{fill:var(--led)}
.led-charge #ledGlow{opacity:.55; fill:var(--led-charge)}
.led-charge #ledDot{fill:var(--led-charge)}

/* Screen overlay */
.screen{position:absolute; left:15.556%; top:10.492%; width:68.889%; height:30.492%; border-radius:3px; overflow:hidden; container-type:size; cursor:pointer}
.scr{position:absolute; inset:0; display:flex; flex-direction:column}
.scr-off{background:radial-gradient(90% 70% at 78% 12%, #1b1d22, var(--dev-glass) 65%)}
.scr-black{background:#000; align-items:center; justify-content:center; color:var(--scr-dim); font:400 5cqw var(--font-pixel); text-align:center; padding:0 6cqw}
.scr-logo{background:var(--scr-logo-bg); align-items:center; justify-content:center; gap:3cqh; flex-direction:row; padding:0 6cqw}
.logo-minis{display:flex; flex-direction:column; gap:2.5cqh}
.logo-minis i{display:block; width:20cqw; height:20cqh; border-radius:2px; background:linear-gradient(90deg,#3e64b8 0 52%,#d5d8de 52%)}
.logo-minis i:nth-child(2){background:linear-gradient(90deg,#c0533d 0 52%,#e6e8ec 52%)}
.logo-minis i:nth-child(3){background:linear-gradient(90deg,#8a5aa8 0 52%,#cfd3da 52%)}
.logo-word{display:flex; flex-direction:column; align-items:flex-start; padding-left:4cqw}
.logo-word b{font:900 italic 15cqw/1 var(--font-ui); color:var(--scr-logo-blue); letter-spacing:-.02em}
.logo-word small{font:600 3.4cqw/1.4 var(--font-mono); color:var(--scr-logo-ink); letter-spacing:.12em; margin-top:2cqh}
.scr-ui{background:var(--scr-bg); color:var(--scr-ink)}
.sbar{display:flex; justify-content:space-between; padding:2.5cqh 4cqw; font:400 3.6cqw/1 var(--font-pixel); color:var(--scr-dim)}
.stitle{padding:1cqh 4cqw 2cqh; font:800 5.2cqw/1.2 var(--font-ui); letter-spacing:.02em}
.slist{list-style:none; margin:0; padding:0 3cqw; display:flex; flex-direction:column; gap:1.2cqh}
.slist li{display:flex; justify-content:space-between; padding:2cqh 2.5cqw; border-radius:1.5cqw; font:600 4.4cqw/1.2 var(--font-ui)}
.slist li.on{background:var(--scr-hi)}
.sfoot{margin-top:auto; display:flex; gap:4cqw; padding:2cqh 4cqw; background:var(--scr-panel); font:600 3.3cqw/1.2 var(--font-ui); color:var(--scr-dim)}
.sfoot b{color:var(--scr-ink); font-family:var(--font-mono)}
.car{flex:1; display:flex; align-items:center; justify-content:space-between; padding:0 3cqw; gap:2cqw}
.car-arrow{font:700 8cqw/1 var(--font-ui); color:var(--scr-dim)}
.car-card{flex:1; height:100%; max-height:52cqh; border-radius:2cqw; background:var(--c); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1cqh}
.car-card b{font:900 12cqw/1 var(--font-ui); letter-spacing:-.01em}
.car-card small{font:600 3.6cqw/1.2 var(--font-ui); opacity:.85}
.car-count{text-align:center; font:400 3.6cqw/1 var(--font-pixel); color:var(--scr-dim); padding:2cqh 0 1cqh}
.game{position:absolute; inset:0; background:linear-gradient(var(--sky-1), var(--sky-2) 75%); overflow:hidden}
.game .ground{position:absolute; left:0; right:0; bottom:0; height:20cqh; background:linear-gradient(var(--grass) 0 25%, var(--dirt) 25%)}
.game .hero{position:absolute; bottom:20cqh; width:7cqw; height:11cqh; background:var(--hero); border-radius:1cqw 1cqw 0 0; transition:left .15s, bottom .2s ease-out; box-shadow:inset 0 -3cqh 0 #2b4fa8}
.game .hero.jump{bottom:42cqh}
.game .coin{position:absolute; width:4cqw; height:4cqw; border-radius:50%; background:var(--coin); top:34cqh}
.game .cloud{position:absolute; width:18cqw; height:6cqh; border-radius:9cqh; background:#ffffffcc; top:12cqh}
.game .hud{position:absolute; top:3cqh; left:4cqw; right:4cqw; display:flex; justify-content:space-between; font:400 3.8cqw/1 var(--font-pixel); color:#fff}
.title{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4cqh; background:#0c1230d9; color:#fff; text-align:center; padding:0 6cqw}
.title b{font:900 8cqw/1.05 var(--font-ui)}
.title span{font:400 4.4cqw/1 var(--font-pixel); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.toast{position:absolute; left:4cqw; right:4cqw; top:4cqh; background:#000000d0; color:#fff; font:600 4cqw/1.3 var(--font-ui); padding:2.5cqh 3cqw; border-radius:1.5cqw; z-index:2}
.meter{display:flex; align-items:center; gap:2cqw}
.meter i{flex:1; height:2.2cqh; background:#ffffff33; border-radius:1cqh; overflow:hidden}
.meter i b{display:block; height:100%; background:#fff}
.hot{position:absolute; right:3cqw; bottom:3cqh; background:var(--scr-hi); color:#fff; font:700 3.4cqw/1 var(--font-mono); padding:1.5cqh 2cqw; border-radius:1cqw; z-index:2}
.dialog{margin:auto; width:78%; background:var(--scr-panel); border-radius:2cqw; padding:4cqh 4cqw; display:flex; flex-direction:column; gap:4cqh; text-align:center; font:700 4.6cqw/1.3 var(--font-ui)}
.dialog div{display:flex; gap:3cqw}
.dialog span{flex:1; padding:2cqh 0; border-radius:1.5cqw; background:#ffffff14}
.dialog span.on{background:var(--scr-hi)}

/* Panels */
.panel{display:flex; flex-direction:column; gap:12px}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px/1 var(--font-ui); padding:9px 12px; border-radius:999px; cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:800}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.info{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px}
.info-head{display:flex; align-items:center; gap:12px}
.cap-icon{flex:none; width:46px; height:46px; border-radius:50%; background:var(--dev-body); border:2px solid var(--dev-edge); display:grid; place-items:center; font:700 13px/1 var(--font-mono); color:var(--scr-ink)}
.info-head h2{margin:0; font-size:21px; line-height:1.2; font-weight:800}
.info-where{margin:2px 0 0; color:var(--muted); font-size:13.5px}
.info dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 12px}
.info dt{font:600 10.5px/2 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.info dd{margin:0; min-width:0}
.info ul{margin:0; padding-left:1.1em}
.combo{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px}
.combo + .combo{margin-top:6px}
kbd{font:600 11.5px/1 var(--font-mono); padding:5px 7px; border-radius:5px; background:var(--dev-body); color:var(--scr-ink); border-bottom:2px solid var(--dev-edge); white-space:nowrap}
.plus{color:var(--muted); font-size:12.5px}
.sec-title{margin:4px 0 0; font:600 11px/1 var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.chapters{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.chapters button{
  appearance:none; width:100%; text-align:left; font:inherit; color:var(--ink); cursor:pointer;
  display:grid; grid-template-columns:28px minmax(0,1fr) auto; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
}
.chapters button[aria-current="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.chapters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.chapters .no{font:600 13px/1 var(--font-mono); color:var(--muted); font-variant-numeric:tabular-nums}
.chapters button[aria-current="true"] .no{color:var(--accent)}
.chapters .t{font-weight:800; font-size:15px}
.chapters .d{display:block; color:var(--muted); font-size:13px; font-weight:400}
.state{font:600 10.5px/1 var(--font-mono); padding:4px 7px; border-radius:4px; background:var(--bg); color:var(--muted); white-space:nowrap}
.state.go{background:var(--accent-soft); color:var(--accent)}
.state.ok{background:var(--ok-soft); color:var(--ok)}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.sheet button{appearance:none; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 16px}
.sheet button:first-child{border-top:0}
.sheet button[aria-pressed="true"]{background:var(--accent-soft)}
.sheet button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.sheet .act{font-weight:600; font-size:14.5px}
.sheet .combo{justify-content:flex-end}
.note{margin:0; font-size:13px; color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  .key.is-target .cap{animation:none; stroke:var(--sel); stroke-width:3.5}
  .guide.shake{animation:none}
  .title span{animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">R36S handheld · Interactive manual</div>
    <h1>R36S <span>Quick Start</span></h1>
    <p class="lede">Learn to switch it on and start a game in a few taps. Press the buttons on the console below, just like the real thing.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tab-guide" data-mode="guide" aria-selected="true">Step by step</button>
    <button class="tab" role="tab" id="tab-learn" data-mode="learn" aria-selected="false">Buttons</button>
    <button class="tab" role="tab" id="tab-sheet" data-mode="sheet" aria-selected="false">Cheat sheet</button>
  </nav>

  <section class="guide" id="guide" aria-live="polite"></section>

  <div class="stage">
    <div class="device" id="device">
      <svg viewBox="0 0 360 610" aria-label="R36S console, front view" id="svg">
        <g class="key" data-key="l2" tabindex="0" role="button" aria-label="L2">
          <rect class="cap" x="40" y="0" width="74" height="17" rx="5"/><text class="tablabel" x="77" y="11" text-anchor="middle">L2</text>
        </g>
        <g class="key" data-key="l1" tabindex="0" role="button" aria-label="L1">
          <rect class="cap" x="40" y="14" width="74" height="18" rx="5"/><text class="tablabel" x="77" y="26" text-anchor="middle">L1</text>
        </g>
        <g class="key" data-key="r2" tabindex="0" role="button" aria-label="R2">
          <rect class="cap" x="246" y="0" width="74" height="17" rx="5"/><text class="tablabel" x="283" y="11" text-anchor="middle">R2</text>
        </g>
        <g class="key" data-key="r1" tabindex="0" role="button" aria-label="R1">
          <rect class="cap" x="246" y="14" width="74" height="18" rx="5"/><text class="tablabel" x="283" y="26" text-anchor="middle">R1</text>
        </g>

        <path d="M38,30 H322 A20,20 0 0 1 342,50 V524 A48,48 0 0 1 294,572 H66 A48,48 0 0 1 18,524 V50 A20,20 0 0 1 38,30 Z" fill="var(--dev-body)" stroke="var(--dev-edge)" stroke-width="1.5"/>
        <path d="M40,36 H320" stroke="#26282d" stroke-width="1" fill="none"/>
        <rect x="40" y="50" width="280" height="244" rx="12" fill="var(--dev-glass)" stroke="#24262b"/>
        <text class="print" x="180" y="280" text-anchor="middle">R36S</text>

        <g class="key" data-key="power" tabindex="0" role="button" aria-label="Power button">
          <rect fill="transparent" x="44" y="562" width="56" height="44"/>
          <rect class="cap" x="50" y="562" width="44" height="16" rx="5"/>
          <text class="outside" x="72" y="597" text-anchor="middle">POWER</text>
        </g>
        <g class="key" data-key="tf" tabindex="0" role="button" aria-label="TF card slot">
          <rect fill="transparent" x="108" y="562" width="44" height="44"/>
          <rect class="cap" x="113" y="566" width="34" height="8" rx="2"/>
          <text class="outside" x="130" y="597" text-anchor="middle">TF card</text>
        </g>
        <g class="key" data-key="usb" tabindex="0" role="button" aria-label="USB-C charging port">
          <rect fill="transparent" x="156" y="562" width="48" height="44"/>
          <rect class="cap" x="166" y="566" width="28" height="9" rx="4.5"/>
          <text class="outside" x="180" y="597" text-anchor="middle">USB-C</text>
        </g>
        <g class="key" data-key="voldown" tabindex="0" role="button" aria-label="Volume down">
          <rect fill="transparent" x="254" y="562" width="36" height="44"/>
          <rect class="cap" x="258" y="562" width="30" height="16" rx="5"/>
          <text class="outside" x="273" y="597" text-anchor="middle">VOL−</text>
        </g>
        <g class="key" data-key="volup" tabindex="0" role="button" aria-label="Volume up">
          <rect fill="transparent" x="292" y="562" width="36" height="44"/>
          <rect class="cap" x="294" y="562" width="30" height="16" rx="5"/>
          <text class="outside" x="309" y="597" text-anchor="middle">VOL+</text>
        </g>

const SHEET = [
  ["Switch on",["POWER"],"hold 3 s"],
  ["Open / confirm",["A"]],
  ["Go back",["B"]],
  ["Exit a game",["SELECT","START"]],
  ["Save state",["SELECT","R1"]],
  ["Load state",["SELECT","L1"]],
  ["In-game menu",["SELECT","X"]],
  ["Brightness",["FN","VOL+/−"]],

];
const LABEL_TO_KEY = {POWER:["power"],A:["a"],B:["b"],SELECT:["select"],START:["start"],R1:["r1"],L1:["l1"],X:["x"],FN:["fn"],"VOL+/−":["volup","voldown"]};

/* ---------- State ---------- */
const S = {mode:"guide", info:"power", sheet:3, ch:0, step:0, stage:0, msg:null,
  view:"systems", sys:0, game:0, menu:0, title:false, heroX:20, jump:false, toast:null, hot:null,
  led:"on", vol:6, bright:7};
let done = {};
try{ done = JSON.parse(localStorage.getItem("r36s-done")||"{}") || {} }catch(e){ done = {} }

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const screenEl = $("#screen"), panel = $("#panel"), guide = $("#guide"), svg = $("#svg");
let timers = [], toastTimer = null, hotTimer = null, holdRaf = null, holdDone = false;

function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms) }catch(e){} }
function later(fn, ms){ timers.push(setTimeout(fn, ms)) }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; clearTimeout(toastTimer); clearTimeout(hotTimer) }
function saveDone(){ try{ localStorage.setItem("r36s-done", JSON.stringify(done)) }catch(e){} }

/* ---------- Simulated console ---------- */
function setView(v){
  S.view = v; renderScreen();
  if(S.mode==="guide"){ const st = curStep(); if(st && st.wait===v) advance() }
}
function toast(html, ms=1600){
  S.toast = html; renderScreen();
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=null; renderScreen() }, ms);
}
function setHot(k){
  S.hot = k; renderScreen(); markHeld();
  clearTimeout(hotTimer);
  if(S.mode!=="guide") hotTimer = setTimeout(()=>{ S.hot=null; renderScreen(); markHeld() }, 3000);
}
function clearHot(){ S.hot=null; clearTimeout(hotTimer); markHeld() }
function powerOn(){
  S.led="on"; S.view="black"; S.blackText="";
  renderScreen();
  later(()=>setView("logo"), 700);
  later(()=>{ S.sys=0; setView("systems") }, 3000);
}
function launch(){
  S.view="black"; S.blackText="LOADING..."; renderScreen();
  later(()=>{ S.title=true; S.heroX=20; setView("game") }, 1400);
}
function meter(label, n){ return `<div class="meter">${label}<i><b style="width:${n*10}%"></b></i>${n*10}%</div>` }

function sim(k){
  if(S.view==="off" || S.view==="black" || S.view==="logo") return;
  if(k==="select" || k==="fn"){ setHot(k); return }
  if(S.hot==="select"){
    clearHot();
    if(S.view==="game" || S.view==="quick"){
      if(k==="start"){ S.menu=0; setView("games"); return }
      if(k==="r1"){ S.saved = S.heroX; toast("Saved state to slot #0"); return }
      if(k==="l1"){ S.heroX = S.saved ?? 20; S.title=false; toast("Loaded state from slot #0"); return }
      if(k==="x"){ S.menu=0; setView("quick"); return }
    }
  }
  if(S.hot==="fn"){
    clearHot();
    if(k==="volup"){ S.bright=Math.min(10,S.bright+1); toast(meter("LIGHT",S.bright)); return }
    if(k==="voldown"){ S.bright=Math.max(1,S.bright-1); toast(meter("LIGHT",S.bright)); return }
  }
  if(k==="volup"){ S.vol=Math.min(10,S.vol+1); toast(meter("VOL",S.vol)); return }
  if(k==="voldown"){ S.vol=Math.max(0,S.vol-1); toast(meter("VOL",S.vol)); return }
  const wrap = (i,n)=>(i+n)%n;
  switch(S.view){
    case "systems":
      if(k==="right"){ S.sys=wrap(S.sys+1,SYSTEMS.length); renderScreen() }
      if(k==="left"){ S.sys=wrap(S.sys-1,SYSTEMS.length); renderScreen() }
      if(k==="a"){ S.game=0; setView("games") }
      if(k==="start"){ S.menu=0; setView("esmenu") }
      break;
    case "games":
      if(k==="down"){ S.game=wrap(S.game+1,GAMES.length); renderScreen() }
      if(k==="up"){ S.game=wrap(S.game-1,GAMES.length); renderScreen() }
      if(k==="r1"){ S.game=GAMES.length-1; renderScreen() }
      if(k==="l1"){ S.game=0; renderScreen() }
      if(k==="a") launch();
      if(k==="b") setView("systems");
      break;
    case "game":
      if(S.title){ if(k==="start"||k==="a"){ S.title=false; renderScreen() } break }
      if(k==="right"){ S.heroX=Math.min(80,S.heroX+12); renderScreen() }
      if(k==="left"){ S.heroX=Math.max(6,S.heroX-12); renderScreen() }
      if(k==="a"){ S.jump=true; renderScreen(); later(()=>{ S.jump=false; renderScreen() }, 380) }
      if(k==="start"){ toast("Paused", 900) }
      break;
    case "quick":
      if(k==="down"){ S.menu=wrap(S.menu+1,QUICK.length); renderScreen() }
      if(k==="up"){ S.menu=wrap(S.menu-1,QUICK.length); renderScreen() }
      if(k==="b"){ setView("game") }
      if(k==="a"){
        const it = QUICK[S.menu];
        if(it==="Resume") setView("game");
        else if(it==="Save state"){ S.saved=S.heroX; setView("game"); toast("Saved state to slot #0") }
        else if(it==="Load state"){ S.heroX=S.saved??20; setView("game"); toast("Loaded state from slot #0") }
        else if(it==="Restart"){ S.title=true; S.heroX=20; setView("game") }
        else { S.menu=S.game; setView("games") }
      }
      break;
    case "esmenu":
      if(k==="down"){ S.menu=wrap(S.menu+1,ESMENU.length); renderScreen() }
      if(k==="up"){ S.menu=wrap(S.menu-1,ESMENU.length); renderScreen() }
      if(k==="b"||k==="start") setView("systems");
      if(k==="a" && ESMENU[S.menu]==="Quit"){ S.menu=0; setView("quitmenu") }
      else if(k==="a") toast("Settings are not part of this demo", 1200);
      break;
    case "quitmenu":
      if(k==="down"){ S.menu=wrap(S.menu+1,QUITMENU.length); renderScreen() }
      if(k==="up"){ S.menu=wrap(S.menu-1,QUITMENU.length); renderScreen() }
      if(k==="b"){ S.menu=ESMENU.length-1; setView("esmenu") }
      if(k==="a" && S.menu===2){ S.menu=0; setView("confirm") }
      else if(k==="a") toast("Pick Shutdown system for this demo", 1200);
      break;
    case "confirm":
      if(k==="left"||k==="right"){ S.menu=1-S.menu; renderScreen() }
      if(k==="b"){ S.menu=2; setView("quitmenu") }
      if(k==="a"){
        if(S.menu===1){ S.menu=2; setView("quitmenu"); break }
        S.view="black"; S.blackText="Shutting down..."; renderScreen();
        later(()=>{ S.led="off"; setView("off") }, 1600);
      }
      break;
  }
}

function renderScreen(){
  const bar = `<div class="sbar"><span>21:30</span><span>BAT 86%</span></div>`;
  const foot = items => `<div class="sfoot">${items.map(([k,t])=>`<span><b>${k}</b> ${t}</span>`).join("")}</div>`;
  const list = (items, idx) => `<ul class="slist">${items.map((t,i)=>`<li class="${i===idx?"on":""}">${t}</li>`).join("")}</ul>`;
  let h = "";
  switch(S.view){
    case "off": h = `<div class="scr scr-off"></div>`; break;
    case "black": h = `<div class="scr scr-black">${S.blackText||""}</div>`; break;
    case "logo": h = `<div class="scr scr-logo"><div class="logo-minis"><i></i><i></i><i></i></div><div class="logo-word"><b>R36S</b><small>OPEN SOURCE CONSOLE</small></div></div>`; break;
    case "systems": {
      const s = SYSTEMS[S.sys];
      h = `<div class="scr scr-ui">${bar}<div class="car"><span class="car-arrow">‹</span><div class="car-card" style="--c:${s[3]}"><b>${s[0]}</b><small>${s[1]}</small></div><span class="car-arrow">›</span></div><div class="car-count">${s[2]} GAMES AVAILABLE</div>${foot([["◀▶","System"],["A","Open"],["START","Menu"]])}</div>`;
      break;
    }
    case "games": {
      const start = Math.max(0, Math.min(S.game-1, GAMES.length-4));
      const shown = GAMES.slice(start, start+4);
      h = `<div class="scr scr-ui">${bar}<div class="stitle">${SYSTEMS[S.sys][0]} · ${SYSTEMS[S.sys][2]} games</div>${list(shown, S.game-start)}${foot([["A","Launch"],["B","Back"]])}</div>`;
      break;
    }
    case "game":
      h = `<div class="scr game"><div class="cloud" style="left:12%"></div><div class="cloud" style="left:62%;top:20cqh"></div><div class="hud"><span>SCORE 0420</span><span>×3</span></div><div class="coin" style="left:44%"></div><div class="coin" style="left:56%"></div><div class="coin" style="left:68%"></div><div class="ground"></div><div class="hero${S.jump?" jump":""}" style="left:${S.heroX}%"></div>${S.title?`<div class="title"><b>${GAMES[S.game]}</b><span>PRESS START</span></div>`:""}</div>`;
      break;
    case "quick": h = `<div class="scr scr-ui">${bar}<div class="stitle">Quick Menu</div>${list(QUICK, S.menu)}${foot([["A","OK"],["B","Back"]])}</div>`; break;
    case "esmenu": h = `<div class="scr scr-ui">${bar}<div class="stitle">Main Menu</div>${list(ESMENU, S.menu)}${foot([["A","Select"],["B","Close"]])}</div>`; break;
    case "quitmenu": h = `<div class="scr scr-ui">${bar}<div class="stitle">Quit</div>${list(QUITMENU, S.menu)}${foot([["A","Select"],["B","Back"]])}</div>`; break;
    case "confirm": h = `<div class="scr scr-ui">${bar}<div class="dialog">Really shut down?<div><span class="${S.menu===0?"on":""}">YES</span><span class="${S.menu===1?"on":""}">NO</span></div></div></div>`; break;
  }
  if(S.toast && S.view!=="off" && S.view!=="black") h += `<div class="toast">${S.toast}</div>`;
  if(S.hot && S.view!=="off") h += `<div class="hot">${S.hot.toUpperCase()} +</div>`;
  screenEl.innerHTML = h;
  svg.classList.toggle("led-on", S.led==="on");
  svg.classList.toggle("led-charge", S.led==="charge");
}

/* ---------- Key highlights ---------- */
function setMarks(cls, ids){
  $$(".key."+cls).forEach(el=>el.classList.remove(cls));
  ids.forEach(id=>$$(`.key[data-key="${id}"]`).forEach(el=>el.classList.add(cls)));
}
function markHeld(){ setMarks("is-held", S.hot?[S.hot]:[]) }

/* ---------- Buttons mode ---------- */
function renderLearn(){
  const d = KEYS[S.info];
  const combos = d.combos.length ? d.combos.map(([ks,label])=>`<div class="combo">${ks.map(k=>`<kbd>${k}</kbd>`).join('<span class="plus">+</span>')}<span class="plus">→</span><span>${label}</span></div>`).join("") : `<span class="note">None</span>`;
  panel.innerHTML = `
    <div class="chips" role="group" aria-label="Choose a button">${CHIP_LIST.map(([id,l])=>`<button class="chip" data-info="${id}" aria-pressed="${id===S.info}">${l}</button>`).join("")}</div>
    <article class="info">
      <div class="info-head"><div class="cap-icon" aria-hidden="true">${d.icon}</div><div><h2>${d.name}</h2><p class="info-where">${d.where}</p></div></div>
      <dl><dt>Does</dt><dd><ul>${d.does.map(x=>`<li>${x}</li>`).join("")}</ul></dd><dt>Combos</dt><dd>${combos}</dd></dl>
    </article>
    <p class="note">The console works while you explore: use the D-pad, A and B to move around the menus. Off? Hold POWER to switch it on.</p>`;
}
function selectInfo(id){ S.info=id; setMarks("is-active", KEYS_OF_INFO[id]||[id]); renderLearn() }

/* ---------- Step-by-step mode ---------- */
function curStep(){ return CHAPTERS[S.ch].steps[S.step] }
function startChapter(i){
  clearTimers(); holdEnd();
  S.ch=i; S.step=0; S.stage=0; S.msg=null; S.toast=null; S.hot=null; markHeld();
  const su = CHAPTERS[i].setup;
  S.view=su.view; S.sys=su.sys??0; S.game=1; S.menu=0; S.title=su.title??true; S.heroX=20; S.jump=false;
  S.led = su.view==="off" ? "off" : "on";
  renderScreen(); renderGuide();
}
function advance(){
  S.step++; S.stage=0;
  if(curStep().final){ done[S.ch]=true; saveDone() }
  renderGuide();
}
function stepTarget(st){
  if(st.key) return [st.key];
  if(st.hold) return [st.hold];
  if(st.combo) return [st.combo[S.stage]];
  return [];
}
function renderGuide(){
  const ch = CHAPTERS[S.ch], st = curStep(), total = ch.steps.length-1;
  let msg = "";
  if(S.msg) msg = `<p class="msg ${S.msg[0]}">${S.msg[1]}</p>`;
  else if(st.combo && S.stage===1) msg = `<p class="msg good">${NICE[st.combo[0]]} is held. Now press ${NICE[st.combo[1]]}.</p>`;
  const next = S.ch < CHAPTERS.length-1;
  guide.innerHTML = `
    <div class="guide-top"><span class="guide-chapter">Chapter ${S.ch+1} · ${ch.title}</span><span class="guide-count">${st.final?"Done":`Step ${S.step+1} of ${total}`}</span></div>
    <div class="guide-steps">${ch.steps.slice(0,total).map((_,i)=>`<i class="${i<S.step?"done":""}"></i>`).join("")}</div>
    <p class="guide-text">${st.text}</p>
    ${st.hint?`<p class="guide-hint">${st.hint}</p>`:""}
    ${st.hold?`<div class="hold" aria-hidden="true"><div id="holdBar"></div></div>`:""}
    ${msg}
    <div class="guide-actions">${st.final
      ? `${next?`<button class="btn primary" data-act="next">Next: ${CHAPTERS[S.ch+1].title} →</button>`:""}<button class="btn" data-act="restart">Repeat</button>`
      : `<button class="btn" data-act="restart">Start over</button>`}</div>`;
  setMarks("is-target", stepTarget(st));
  renderChapters();
}
function renderChapters(){
  panel.innerHTML = `<h2 class="sec-title">Chapters</h2><ol class="chapters">${CHAPTERS.map((c,i)=>{
      const cur = i===S.ch;
      const state = done[i] ? `<span class="state ok">Done</span>` : cur ? `<span class="state go">Now</span>` : `<span class="state">${c.steps.length-1} steps</span>`;
      return `<li><button data-ch="${i}" aria-current="${cur}"><span class="no">${String(i+1).padStart(2,"0")}</span><span class="t">${c.title}<span class="d">${c.desc}</span></span>${state}</button></li>`;
    }).join("")}</ol>
    <p class="note">Your progress is remembered on this phone.</p>`;
}
function wrong(text){
  S.msg = ["wrong", text]; renderGuide();
  guide.classList.remove("shake"); void guide.offsetWidth; guide.classList.add("shake"); buzz([30,40,30]);
}
function guideKey(k){
  const st = curStep();
  if(st.final || st.wait) return;
  S.msg = null;
  if(st.key){
    if(k===st.key){ buzz(20); if(["usb","tf","led"].includes(k)) sideEffect(k); else sim(k); advance(); return }
  }else if(st.hold){
    wrong(k===st.hold ? "Keep it pressed until the bar is full." : `This step needs POWER. It's the flashing button on the bottom edge.`); return;
  }else if(st.combo){
    const [h, t] = st.combo;
    if(S.stage===0 && k===h){ buzz(15); sim(h); S.stage=1; renderGuide(); return }
    if(S.stage===1 && k===t){ buzz(20); sim(t); advance(); return }
    if(S.stage===1 && k===h){ renderGuide(); return }
    clearHot(); S.hot=null; renderScreen(); S.stage=0;
    wrong(`Press ${NICE[h]} first, then ${NICE[t]}.`); return;
  }
  wrong(`This step needs ${NICE[stepTarget(st)[0]]}. It's the one flashing.`);
}
function sideEffect(k){
  if(k==="usb" && S.view==="off" && S.ch===CHAPTERS.length-1){ S.led="charge"; renderScreen() }
}

/* Hold POWER */
function holdStart(){
  holdDone=false; const t0=performance.now(), need=1800;
  const tick = now => {
    const p = Math.min(1,(now-t0)/need), bar=$("#holdBar");
    if(bar) bar.style.width=(p*100)+"%";
    if(p>=1){
      holdRaf=null; holdDone=true; buzz(60);
      if(S.mode==="guide"){ advance() }
      powerOn(); return;
    }
    holdRaf = requestAnimationFrame(tick);
  };
  holdRaf = requestAnimationFrame(tick);
}
function holdEnd(){ if(holdRaf){ cancelAnimationFrame(holdRaf); holdRaf=null; const bar=$("#holdBar"); if(bar) bar.style.width="0" } }
function canHold(){
  if(S.view!=="off") return false;
  if(S.mode==="guide") return !!curStep().hold;
  return true;
}

/* ---------- Cheat sheet ---------- */
function renderSheet(){
  panel.innerHTML = `<div class="sheet">${SHEET.map(([act,ks,extra],i)=>`<button data-row="${i}" aria-pressed="${i===S.sheet}"><span class="act">${act}</span><span class="combo">${ks.map(k=>`<kbd>${k}</kbd>`).join('<span class="plus">+</span>')}${extra?`<span class="plus">${extra}</span>`:""}</span></button>`).join("")}</div>
  <p class="note">Tap a row to light up those buttons. "Hold SELECT, then press START" means: keep SELECT down while you press START. If a combo does nothing on your console, try FN instead of SELECT.</p>`;
  setMarks("is-active", SHEET[S.sheet][1].flatMap(l=>LABEL_TO_KEY[l]||[]));
}

/* ---------- Modes ---------- */
function setMode(m, fromTap){
  S.mode=m; clearTimers(); holdEnd(); S.hot=null; S.toast=null; markHeld();
  try{ localStorage.setItem("r36s-mode", m) }catch(e){}
  $$(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.mode===m));
  guide.hidden = m!=="guide";
  document.body.classList.toggle("guide-mode", m==="guide");
  setMarks("is-target", []); setMarks("is-active", []);
  if(m==="guide"){ startChapter(S.ch); if(fromTap) $(".tabs").scrollIntoView({behavior:"smooth", block:"start"}); return }
  if(["black","logo","off"].includes(S.view) || m==="sheet"){ S.view="systems"; S.led="on" }
  if(S.view!=="off") S.led="on";
  renderScreen();
  if(m==="learn") selectInfo(S.info); else renderSheet();
}

function onKey(k){
  if(S.mode==="guide"){ guideKey(k); return }
  if(S.mode==="learn") selectInfo(INFO_OF[k]||k);
  sim(k);
}
$$(".key").forEach(el=>{
  const k = el.dataset.key;
  el.addEventListener("pointerdown", e=>{
    el.classList.add("pressing"); buzz(8);
    if(k==="power" && canHold()){ e.preventDefault(); holdStart() }
  });
  const up = ()=>{ el.classList.remove("pressing"); if(k==="power") holdEnd() };
  el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
  el.addEventListener("click", ()=>{
    if(holdDone){ holdDone=false; if(k==="power") return }
    if(k==="power" && S.mode!=="guide" && S.view==="off"){ selectInfo("power"); return }
    onKey(k);
  });
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onKey(k) } });
  el.addEventListener("contextmenu", e=>e.preventDefault());
});
screenEl.addEventListener("click", ()=>{ if(S.mode==="learn") selectInfo("screen") });
$$(".tab").forEach(t=>t.addEventListener("click", ()=>setMode(t.dataset.mode, true)));
panel.addEventListener("click", e=>{
  const chip = e.target.closest("[data-info]"); if(chip){ selectInfo(chip.dataset.info); return }
  const row = e.target.closest("[data-row]"); if(row){ S.sheet=+row.dataset.row; renderSheet(); return }
  const ch = e.target.closest("[data-ch]"); if(ch){ startChapter(+ch.dataset.ch); guide.scrollIntoView({behavior:"smooth", block:"center"}) }
});
guide.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.act==="restart") startChapter(S.ch);
  if(b.dataset.act==="next") startChapter(S.ch+1);
});

let saved = "guide";
try{ saved = localStorage.getItem("r36s-mode") || "guide" }catch(e){}
setMode(["learn","guide","sheet"].includes(saved)?saved:"guide");
</script>

</body>
